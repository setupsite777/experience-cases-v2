<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Вход</title>
<style>
:root{--bg:#111111;--fg:#FFFFFF;--mut:#9A9A9A;--line:rgba(255,255,255,.14);--acc:#FF4600;--err:#FF7A4D}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:340px;display:grid;gap:14px}
h1{font-size:22px;font-weight:600;margin:0}
p{margin:0;color:var(--mut);font-size:15px}
input{width:100%;font:inherit;font-size:17px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 14px;outline:none}
input:focus{border-color:var(--acc)}
button{font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:13px 14px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
#e{color:var(--err);min-height:1.4em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
<h1>Введите пароль</h1>
<p>Презентация открывается по&nbsp;паролю.</p>
<input id="u" name="username" type="text" value="presentation" autocomplete="username" hidden>
<input id="p" name="password" type="password" autocomplete="current-password" aria-label="Пароль" required autofocus>
<button id="b" type="submit">Открыть</button>
<p id="e" role="alert"></p>
</form>
<script>
const BASE = "/experience-cases-v2/", SALT = "v9csCp0yCr8N1joSm5AMFQ==", ITER = 600000, DB = "lock-experience-cases-v2-", DAY = 864e5;
const $ = (id) => document.getElementById(id);
const OK = "serviceWorker" in navigator && window.isSecureContext && window.crypto && crypto.subtle && window.indexedDB;

function idb(op, val) {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("k");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const s = r.result.transaction("k", op === "get" ? "readonly" : "readwrite").objectStore("k");
      const q = op === "get" ? s.get("key") : s.put(val, "key");
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    };
  });
}
function busy(on, text) {
  $("b").disabled = on;
  $("b").textContent = on ? "Проверяю…" : "Открыть";
  if (text !== undefined) $("e").textContent = text;
}

if (!OK) {
  busy(true, "Этот браузер не открывает защищённые страницы. Откройте ссылку в Chrome, Safari или Firefox.");
  $("b").textContent = "Открыть";
} else {
  // жёсткое обновление обходит сервис-воркер: ключ ещё действует — одно обычное обновление
  (async () => {
    try {
      const reg = await navigator.serviceWorker.getRegistration(BASE);
      const v = await idb("get");
      if (reg && reg.active && v && v.exp > Date.now() && !navigator.serviceWorker.controller && !sessionStorage.getItem("lockTry")) {
        sessionStorage.setItem("lockTry", "1");
        location.reload();
      }
    } catch (e) {}
  })();
}

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw = $("p").value;
  if (!OK || !pw) return;
  busy(true, "");
  try {
    const salt = Uint8Array.from(atob(SALT), (c) => c.charCodeAt(0));
    const pk = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: ITER }, pk, 256));
    const k = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    const r = await fetch(BASE + "d/m.bin", { cache: "no-cache" });
    if (!r.ok) throw new Error("m.bin " + r.status);
    const b = new Uint8Array(await r.arrayBuffer());
    try {
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(0, 12) }, k, b.subarray(12));
    } catch (e) {
      busy(false, "Пароль не подошёл");
      $("p").select();
      return;
    }
    await idb("put", { k: bits, exp: Date.now() + DAY });
    await navigator.serviceWorker.register(BASE + "sw.js", { scope: BASE });
    const reg = await navigator.serviceWorker.ready;
    await new Promise((res) => {
      const ch = new MessageChannel();
      ch.port1.onmessage = () => res();
      reg.active.postMessage("reset", [ch.port2]);
      setTimeout(res, 1500);
    });
    sessionStorage.removeItem("lockTry");
    location.reload();
  } catch (e) {
    busy(false, "Не получилось открыть. Проверьте связь и попробуйте ещё раз.");
  }
});
</script>
</body>
</html>
